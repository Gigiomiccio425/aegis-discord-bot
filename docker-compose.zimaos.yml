# ─────────────────────────────────────────────────────────────
#  ANGEL — installazione su ZimaOS
#
#  App Store → Install a Custom App → incolla questo file.
#
#  Non compila nulla: scarica un'immagine già pronta da GitHub Container
#  Registry. L'installer di ZimaOS non ha i sorgenti sul disco e non potrebbe
#  eseguire una build.
#
#  ⬇ TUTTO CIÒ CHE DEVI MODIFICARE STA NEL BLOCCO QUI SOTTO ⬇
# ─────────────────────────────────────────────────────────────
name: aegis

# ═════════════════════════════════════════════════════════════
#  1. COMPILA QUI — sette valori, poi non serve altro
# ═════════════════════════════════════════════════════════════

# Token del bot — Developer Portal → Bot → Reset Token
x-discord-token: &discord-token 'METTI_QUI_IL_TOKEN_DEL_BOT'

# Application ID — Developer Portal → General Information
x-discord-client-id: &discord-client-id 'METTI_QUI_IL_CLIENT_ID'

# Client Secret — Developer Portal → OAuth2. Serve solo al pannello.
x-discord-client-secret: &discord-client-secret 'METTI_QUI_IL_CLIENT_SECRET'

# Il tuo ID Discord (Impostazioni → Avanzate → Modalità sviluppatore,
# poi tasto destro sul tuo nome → Copia ID utente). Più ID separati da virgola.
x-owner-ids: &owner-ids 'METTI_QUI_IL_TUO_ID'

# Indirizzo da cui aprirai il pannello. Deve combaciare **esattamente** con
# quello che digiterai nel browser, porta compresa, ed essere lo stesso che
# registri come redirect OAuth2 (con /api/auth/callback in fondo).
x-public-url: &public-url 'http://IP_DELLA_TUA_VPS:780'

# Password del database. Inventala, non serve ricordarla: nessuno la digiterà.
#
# ⚠️ Va scritta in DUE punti, qui e dentro l'URL sotto, e devono coincidere.
# Le àncore YAML copiano un valore intero, non sanno inserirlo dentro una
# stringa più lunga: se ci fosse un modo di scriverla una volta sola, lo userei.
x-db-password: &db-password 'CAMBIA_QUESTA_PASSWORD'
x-database-url: &database-url 'postgresql://aegis:CAMBIA_QUESTA_PASSWORD@aegis-postgres:5432/aegis?schema=public'

# Due segreti DIVERSI fra loro, generati con:  openssl rand -hex 32
# Il primo firma i cookie del pannello, il secondo cifra i token nel database.
x-session-secret: &session-secret 'PRIMO_openssl_rand_hex_32'
x-encryption-key: &encryption-key 'SECONDO_openssl_rand_hex_32_DIVERSO_DAL_PRIMO'

# ═════════════════════════════════════════════════════════════
#  2. Da qui in giù non serve modificare nulla
# ═════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────
  #  ANGEL — un solo container per tutto
  #
  #  Dentro girano quattro cose: la migrazione del database, il bot, il
  #  worker e il pannello. Prima erano quattro container separati, ed è
  #  stato un errore: condividevano la stessa immagine, e bastava che un
  #  aggiornamento ne ricreasse tre su quattro perché il sistema diventasse
  #  incomprensibile — il pannello mostrava la versione nuova, il bot si
  #  comportava come prima, e sembrava che la correzione non funzionasse.
  #
  #  Con un container solo c'è una riga da cambiare per aggiornare e una
  #  cosa da riavviare. Dentro, un supervisore tiene in vita i tre processi
  #  e li riavvia se cadono, con attesa crescente fra un tentativo e l'altro.
  # ─────────────────────────────────────────────────────────
  angel:
    # ⬇ PER AGGIORNARE: cambia il numero qui e riavvia l'app. È l'unico posto.
    image: ghcr.io/gigiomiccio425/aegis-discord-bot:1.18.1
    # Riscarica l'immagine a ogni avvio. Indispensabile con `latest`, che cambia
    # sotto lo stesso nome; con una versione fissa non fa danno e toglie un dubbio.
    pull_policy: always
    container_name: angel
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: *database-url
      REDIS_URL: redis://aegis-redis:6379
      ENCRYPTION_KEY: *encryption-key
      STORAGE_DIR: /data/storage

      DISCORD_TOKEN: *discord-token
      DISCORD_CLIENT_ID: *discord-client-id
      DISCORD_CLIENT_SECRET: *discord-client-secret
      OWNER_IDS: *owner-ids
      PUBLIC_URL: *public-url
      SESSION_SECRET: *session-secret
      API_PORT: '8080'
      DEV_GUILD_ID: ''

      # Riserva il pannello agli ID in OWNER_IDS. Con 'false' entra chiunque
      # abbia MANAGE_GUILD su un server dove il bot è presente: per
      # un'installazione personale va tenuto acceso.
      PANEL_OWNERS_ONLY: 'true'

      # Facoltative: senza, lo scanner usa le sole blocklist locali e le
      # integrazioni Twitch restano spente. Si possono aggiungere dopo.
      GOOGLE_SAFE_BROWSING_KEY: ''
      THREAT_FEEDS_ENABLED: 'true'
      TWITCH_CLIENT_ID: ''
      TWITCH_CLIENT_SECRET: ''
      TWITCH_EVENTSUB_SECRET: ''

      # Dove finiscono le copie dei propri dati. Sta fuori dai volumi
      # dell'applicazione di proposito: disinstallando l'app da ZimaOS i volumi
      # possono sparire, e una copia che sparisce insieme a cio che protegge
      # non protegge nulla.
      BACKUP_DIR: /backup
      BACKUP_KEEP: '14'
    volumes:
      - /DATA/AppData/aegis/storage:/data/storage
      # Cartella sull'host, non un volume Docker: sopravvive alla
      # disinstallazione dell'app.
      - /DATA/angel-backup:/backup
    # La porta la pubblica direttamente il pannello: su ZimaOS un reverse proxy
    # in più complicherebbe soltanto, visto che l'interfaccia collega l'app alla
    # porta dichiarata qui.
    ports:
      - target: 8080
        published: '780'
        protocol: tcp
    depends_on:
      - aegis-postgres
      - aegis-redis

  # I nomi restano `aegis-*` anche dopo il cambio di nome del progetto:
  # rinominarli su un'installazione già avviata farebbe creare a Docker
  # container e volumi nuovi, lasciando orfano il database esistente.
  aegis-postgres:
    # Debian e non Alpine: su alcune installazioni di ZimaOS il bash
    # dell'immagine Alpine non risulta eseguibile e Postgres non parte,
    # fallendo con «env: can't execute bash: Permission denied» prima di
    # scrivere una riga di log.
    image: postgres:17
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: *db-password
      POSTGRES_DB: aegis
    volumes:
      - /DATA/AppData/aegis/postgres:/var/lib/postgresql/data
    # Nessun healthcheck: su ZimaOS l'exec dentro i container viene rifiutato
    # («exec failed: permission denied») e il controllo fallirebbe per sempre,
    # bloccando chi attende il servizio «sano». L'attesa sta nel supervisore
    # dentro ANGEL, che riprova finché il database non risponde.

  aegis-redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - /DATA/AppData/aegis/redis:/data

x-casaos:
  architectures:
    - amd64
    - arm64
  main: angel
  author: Gigiomiccio425
  developer: Gigiomiccio425
  category: Network
  icon: https://raw.githubusercontent.com/Gigiomiccio425/aegis-discord-bot/main/docs/icon.svg
  title:
    en_us: ANGEL
    it_it: ANGEL
  tagline:
    en_us: ANGEL — the guardian of your Discord server
    it_it: ANGEL — il custode del tuo server Discord
  description:
    en_us: >-
      Self-hosted Discord moderation and security bot. Anti-raid, anti-nuke,
      image scanning with QR and OCR, deep audit log, and a web control panel.
    it_it: >-
      Bot Discord di moderazione e sicurezza self-hosted. Anti-raid, anti-nuke,
      scanner delle immagini con lettura dei QR e OCR, registro approfondito di
      ogni azione e pannello di controllo web.
  index: /
  port_map: '780'
  scheme: http
  webui_port: 780
  tips:
    before_install:
      it_it: >-
        **Compila i sette valori nel blocco in cima al file, poi non serve
        toccare altro.**


        1. Crea l'applicazione su https://discord.com/developers/applications


        2. Sezione **Bot**: copia il token, e attiva **tutti e tre** i
        Privileged Gateway Intents — *Presence*, *Server Members* e *Message
        Content*. Se ne manca anche uno solo Discord rifiuta la connessione con
        «Used disallowed intents» e il bot riparte in ciclo senza collegarsi.


        3. Sezione **OAuth2**: copia *Client ID* e *Client Secret*, e aggiungi
        come redirect `http://IP_DELLA_TUA_VPS:780/api/auth/callback`


        4. Genera due segreti **diversi** con `openssl rand -hex 32`


        5. Sostituisci `IP_DELLA_TUA_VPS` con l'indirizzo reale: se non
        combacia con quello che digiti nel browser, l'accesso al pannello
        fallisce con «stato non valido»


        6. Invita il bot e **sposta il suo ruolo in cima alla lista dei
        ruoli**: Discord non consente di agire su chi sta più in alto, ed è il
        motivo più frequente per cui una difesa non riesce a sanzionare


        Pannello su `http://IP_DELLA_TUA_VPS:780`. Il bot parte con **tutti i
        moduli spenti**: si attivano dal pannello, e conviene tenere la
        modalità prova accesa per qualche giorno prima di far sanzionare.
      en_us: >-
        **Fill in the seven values in the block at the top of the file.** You
        need a Discord application with a bot token, client ID and secret, all
        three privileged intents enabled, and two different secrets generated
        with `openssl rand -hex 32`.
