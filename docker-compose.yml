# ─────────────────────────────────────────────────────────────
#  AEGIS — stack completo
#  ZimaOS: App Store → "Install a Custom App" → incolla questo file.
#  Richiede un file .env accanto (vedi .env.example).
# ─────────────────────────────────────────────────────────────
name: aegis

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  STORAGE_DIR: /data/storage

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Necessario per la ricerca full-text accent-insensitive nel log explorer
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=it-IT"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Non esposto all'esterno: solo la rete interna vi accede.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    command: ["npm", "run", "deploy", "-w", "@aegis/db"]
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    command: ["node", "apps/bot/dist/index.js"]
    restart: unless-stopped
    environment:
      <<: *common-env
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      OWNER_IDS: ${OWNER_IDS}
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
    volumes:
      - app_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    command: ["node", "apps/worker/dist/index.js"]
    restart: unless-stopped
    environment:
      <<: *common-env
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      GOOGLE_SAFE_BROWSING_KEY: ${GOOGLE_SAFE_BROWSING_KEY:-}
      THREAT_FEEDS_ENABLED: ${THREAT_FEEDS_ENABLED:-true}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - app_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    command: ["node", "apps/api/dist/index.js"]
    restart: unless-stopped
    environment:
      <<: *common-env
      API_PORT: 8080
      PUBLIC_URL: ${PUBLIC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      OWNER_IDS: ${OWNER_IDS}
      TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET:-}
    volumes:
      - app_storage:/data/storage
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Su ZimaOS cambia la porta host se 80/443 sono già occupate,
      # es. "8443:443". Con dominio pubblico lascia 80+443 per l'HTTPS automatico.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Metti il tuo dominio per ottenere HTTPS automatico da Let's Encrypt.
      # Lascia :80 per accesso solo in rete locale via IP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  app_storage:
  caddy_data:
  caddy_config:
