manifestVersion: 1

# Deve cominciare con l'`id` dello store, quello in `umbrel-app-store.yml`.
# La cartella che contiene questo file deve chiamarsi esattamente così: è
# anche il prefisso dei nomi dei container, e quindi di `APP_HOST` dentro
# il compose.
id: g-d-app-store-gd-angel

category: Networking
name: ANGEL
version: "1.28.0"
tagline: Il custode del tuo server Discord

description: >
  Bot Discord di moderazione e sicurezza self-hosted, con pannello web.


  Cosa ferma:


  - Raid e nuke, con soglie per attore e istantanee d'emergenza

  - Account compromessi che di colpo pubblicano link e immagini

  - Immagini truffa: legge i QR e fa OCR del testo, riconosce le campagne dall'impronta percettiva

  - QR verso il login di Discord — furto di sessione senza che la vittima digiti nulla

  - ClickFix: le finte CAPTCHA che fanno incollare un comando PowerShell

  - Inviti dirottati, webhook non autorizzati, bot con troppi permessi

  - Chi si finge staff, con confronto per somiglianza sui nomi e sull'immagine


  E poi: registro di ogni azione, archivio dei messaggi con trascrizioni HTML
  autonome, ticket, sondaggi, eventi, giveaway, comandi personalizzati con
  personas, copia di sicurezza notturna con ripristino.


  Dentro c'è anche un bot di chat Twitch: anti-spam, link truffa, venditori di
  visualizzatori, ondate ostili, messaggi a tempo e comandi. Ha un pannello
  suo sulla porta 781, pensato per essere dato agli streamer.


  Il bot parte con tutti i moduli spenti: si accendono dal pannello, e conviene
  tenere la modalità prova accesa per qualche giorno prima di far sanzionare
  qualcuno davvero.

developer: Gigiomiccio425
website: https://github.com/Gigiomiccio425/aegis-discord-bot
dependencies: []
repo: https://github.com/Gigiomiccio425/aegis-discord-bot
support: https://github.com/Gigiomiccio425/aegis-discord-bot/issues

# La porta che umbrelOS apre e gira ad `app_proxy`. La stessa della VPS, così
# l'indirizzo del pannello non cambia e il redirect OAuth2 già registrato su
# Discord continua a valere.
port: 780

icon: https://raw.githubusercontent.com/Gigiomiccio425/aegis-discord-bot/main/docs/icon.svg

path: ""
defaultUsername: ""
defaultPassword: ""

releaseNotes: >
  Il lockdown funziona davvero, e il pannello dice cosa è successo.


  - Il lockdown chiude anche le chat testuali delle vocali e dei palchi, e
    sospende i permessi di scrittura dati ai singoli ruoli — che prima
    scavalcavano il blocco. I canali che non riesce a chiudere ora li elenca
    con il motivo, invece di rispondere «chiusi: 0».

  - I comandi dal pannello non si perdono più se il bot si sta riavviando:
    restano in coda, e l'esito — fatto, fallito e perché — torna indietro.
    La dashboard mostra se il lockdown è attivo e se il bot è collegato.

  - Un secondo modello di server, «yuyu»: stessa struttura, nomi e simboli
    diversi, e i verificati si chiamano come la community.

  - Sicurezza: i due pannelli non si fidano più l'uno dell'altro (stesso sito,
    porte diverse), l'accesso concesso automaticamente si revoca quando su
    Discord sparisce il permesso, e lo scanner non segue più i link verso la
    rete interna della macchina.

  - In modalità prova l'anti-raid non blocca più il server per davvero.

submitter: Gigiomiccio425
