manifestVersion: 1

# Deve cominciare con l'`id` dello store, quello in `umbrel-app-store.yml`.
# La cartella che contiene questo file deve chiamarsi esattamente così: è
# anche il prefisso dei nomi dei container, e quindi di `APP_HOST` dentro
# il compose.
id: g-d-app-store-gd-angel

category: Networking
name: ANGEL
version: "1.30.0"
tagline: Il custode del tuo server Discord

description: >
  Bot Discord di moderazione e sicurezza self-hosted, con pannello web.


  Cosa ferma:


  - Raid e nuke, con soglie per attore e istantanee d'emergenza

  - Account compromessi che di colpo pubblicano link e immagini

  - Immagini truffa: legge i QR e fa OCR del testo, riconosce le campagne dall'impronta percettiva

  - QR verso il login di Discord — furto di sessione senza che la vittima digiti nulla

  - ClickFix: le finte CAPTCHA che fanno incollare un comando PowerShell

  - Inviti dirottati, webhook non autorizzati, bot con troppi permessi

  - Chi si finge staff, con confronto per somiglianza sui nomi e sull'immagine


  E poi: registro di ogni azione, archivio dei messaggi con trascrizioni HTML
  autonome, ticket, sondaggi, eventi, giveaway, comandi personalizzati con
  personas, copia di sicurezza notturna con ripristino.


  Dentro c'è anche un bot di chat Twitch: anti-spam, link truffa, venditori di
  visualizzatori, ondate ostili, messaggi a tempo e comandi. Ha un pannello
  suo sulla porta 781, pensato per essere dato agli streamer.


  Il bot parte con tutti i moduli spenti: si accendono dal pannello, e conviene
  tenere la modalità prova accesa per qualche giorno prima di far sanzionare
  qualcuno davvero.

developer: Gigiomiccio425
website: https://github.com/Gigiomiccio425/aegis-discord-bot
dependencies: []
repo: https://github.com/Gigiomiccio425/aegis-discord-bot
support: https://github.com/Gigiomiccio425/aegis-discord-bot/issues

# La porta che umbrelOS apre e gira ad `app_proxy`. La stessa della VPS, così
# l'indirizzo del pannello non cambia e il redirect OAuth2 già registrato su
# Discord continua a valere.
port: 780

icon: https://raw.githubusercontent.com/Gigiomiccio425/aegis-discord-bot/main/docs/icon.svg

path: ""
defaultUsername: ""
defaultPassword: ""

releaseNotes: >
  Nel compose non c'è più nessun dato sensibile.


  - Token, chiavi e password vivono in `app-data/…/data/segreti/`, una
    cartella con i permessi stretti che gli aggiornamenti non toccano. Il
    compose viene riscritto dal repository a ogni aggiornamento, e adesso non
    c'è più niente da rimettere: contiene solo dove trovare i valori.

  - Da scrivere a mano restano cinque righe — token, applicazione Discord,
    indirizzo del pannello, il tuo ID. Segreto di sessione, chiave di
    cifratura e password del database ANGEL se li genera al primo avvio.

  - Se manca qualcosa, il bot non si riavvia in ciclo: parte solo il pannello
    e il resto **aspetta**, ricontrollando ogni quindici secondi. Appena i
    valori ci sono parte da solo, senza riavviare l'app. Nei log compaiono i
    nomi, mai i valori.

  - Postgres riceve la password da un file (`POSTGRES_PASSWORD_FILE`) e monta
    quella cartella in sola lettura.


  - Il pannello diceva «bot: fermo» e «il bot non è collegato» di un bot che
    invece era collegato e funzionava, e i comandi risultavano non eseguiti.
    È lo stesso guasto: il pannello non guarda il bot, guarda tre chiavi che
    il bot scrive su Redis — versione, battito, esito dei comandi. Se una di
    quelle scritture falliva, il fallimento spariva e restavano solo i
    sintomi. Ora ogni modo di fallire finisce nei log, compreso quello che
    inganna di più: Redis che non risponde e accoda il comando invece di
    rifiutarlo, dove «nessun errore» non vuol dire «scritto».


  - «512 minacce oggi» con zero minacce vere: il contatore prendeva tutta la
    categoria SECURITY, dentro cui stanno anche gli snapshot che ANGEL si fa
    da solo. Ora conta solo quello che è stato tentato contro il server.


  - Correzione della 1.29.2: nei log comparivano uno snapshot ogni due
    secondi e promemoria «scaduto» a ripetizione. Non era uno scheduler
    impazzito: erano gli stessi comandi, riconsegnati e rieseguiti per
    sempre. Bastava una voce che non si riusciva a confermare perché tutta
    la coda ripartisse a ogni giro. Ora il recupero avanza invece di
    ricominciare, e ogni comando si conferma anche quando fallisce.


  - Correzione della 1.29.1: su un'installazione nuova Postgres non partiva,
    e diceva `/segreti/postgres_password: No such file or directory`. Le
    cartelle di bind-mount le crea Docker di root, e ANGEL gira con uid
    1000: non poteva scrivere la password. Adesso un container sistema il
    proprietario al primo avvio, e non c'è nessun comando da dare a mano.


  Aggiornando da una versione precedente: se avevi già un `segreti.env` in
  `data/storage` viene letto lo stesso, e nei log trovi il comando per
  spostarlo. Se invece i valori erano solo nel compose, travasali **prima** di
  aggiornare con lo script `docker/segreti.sh` — le istruzioni sono nel
  README dello store.

