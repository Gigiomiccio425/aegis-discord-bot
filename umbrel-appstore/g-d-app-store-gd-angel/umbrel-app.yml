manifestVersion: 1

# Deve cominciare con l'`id` dello store, quello in `umbrel-app-store.yml`.
# La cartella che contiene questo file deve chiamarsi esattamente così: è
# anche il prefisso dei nomi dei container, e quindi di `APP_HOST` dentro
# il compose.
id: g-d-app-store-gd-angel

category: Networking
name: ANGEL
version: "1.31.2"
tagline: Il custode del tuo server Discord

description: >
  Bot Discord di moderazione e sicurezza self-hosted, con pannello web.


  Cosa ferma:


  - Raid e nuke, con soglie per attore e istantanee d'emergenza

  - Account compromessi che di colpo pubblicano link e immagini

  - Immagini truffa: legge i QR e fa OCR del testo, riconosce le campagne dall'impronta percettiva

  - QR verso il login di Discord — furto di sessione senza che la vittima digiti nulla

  - ClickFix: le finte CAPTCHA che fanno incollare un comando PowerShell

  - Inviti dirottati, webhook non autorizzati, bot con troppi permessi

  - Chi si finge staff, con confronto per somiglianza sui nomi e sull'immagine


  E poi: registro di ogni azione, archivio dei messaggi con trascrizioni HTML
  autonome, ticket, sondaggi, eventi, giveaway, comandi personalizzati con
  personas, copia di sicurezza notturna con ripristino.


  Dentro c'è anche un bot di chat Twitch: anti-spam, link truffa, venditori di
  visualizzatori, ondate ostili, messaggi a tempo e comandi. Ha un pannello
  suo sulla porta 781, pensato per essere dato agli streamer.


  Il bot parte con tutti i moduli spenti: si accendono dal pannello, e conviene
  tenere la modalità prova accesa per qualche giorno prima di far sanzionare
  qualcuno davvero.

developer: Gigiomiccio425
website: https://github.com/Gigiomiccio425/aegis-discord-bot
dependencies: []
repo: https://github.com/Gigiomiccio425/aegis-discord-bot
support: https://github.com/Gigiomiccio425/aegis-discord-bot/issues

# La porta che umbrelOS apre e gira ad `app_proxy`. La stessa della VPS, così
# l'indirizzo del pannello non cambia e il redirect OAuth2 già registrato su
# Discord continua a valere.
port: 780

icon: https://raw.githubusercontent.com/Gigiomiccio425/aegis-discord-bot/main/docs/icon.svg

path: ""
defaultUsername: ""
defaultPassword: ""

releaseNotes: >
  Il pannello dice cose vere, e quando qualcosa si blocca lo dice anche lui.


  - **«512 minacce oggi» non c'è più.** Il contatore contava tutta la
    categoria sicurezza, dentro cui stanno anche gli snapshot e i lockdown
    che ANGEL fa da solo. Ora conta solo le minacce vere: un numero che
    parte da cinquecento non fa notare niente, e una minaccia vera ci si
    perdeva dentro.

  - **Il worker non risulta più «fermo» mentre lavora.** I dieci lavori in
    coda aspettavano tutti sulla stessa connessione a Redis con cui il
    worker dichiara di essere vivo, e la dichiarazione poteva arrivare
    troppo tardi. Ora ognuno ha la sua.

  - **Quando un processo risulta «fermo», i log dicono perché.** Se Redis
    rifiuta la dichiarazione, se non risponde, o se il ciclo degli eventi
    del bot resta bloccato per più di due secondi, c'è una riga che lo
    dice. Prima quei casi erano identici: la chiave mancava e basta.


  Il lockdown non chiude ancora le chat dei canali vocali: arriva in una
  prossima versione.


  Dalla 1.31.1: i comandi del pannello tornano ad arrivare al bot.


  - **Il nome di Redis poteva portare al Redis di un'altra app.** Il compose
    lo cercava come `redis`. Su umbrelOS tutte le app stanno sulla stessa
    rete, e se un'altra app installata ha un servizio con quel nome — Immich,
    Nextcloud e molte altre ce l'hanno — il nome risponde con due indirizzi e
    ogni connessione ne prende uno a caso. Redis non ha password, quindi la
    connessione a quello sbagliato riesce senza errori. Il pannello poteva
    pubblicare i comandi su un Redis mentre il bot li aspettava su un altro:
    «bot: fermo» detto di un bot collegato a Discord, e lockdown che
    rispondevano «fatto» senza fare niente. Ora ANGEL usa il nome completo
    del container, che è unico, come fanno le app ufficiali. Lo stesso per
    Postgres.

  - **Il pannello dice quando un comando non lo sente nessuno.** Redis
    restituisce quanti hanno ricevuto un comando, e quel numero veniva
    buttato via. Adesso, se sono zero, nei log c'è una riga che lo dice.

  - **Redis lento all'avvio non tiene più fermo il bot.** Il bot si collega a
    Discord prima di mettersi in ascolto del pannello, e l'ascolto riprova da
    solo finché non ci riesce.

  - **Un link scritto in chat non può più far contattare al bot la tua rete
    di casa.** Il bot segue i redirect dei link per vedere dove portano; ora
    rifiuta ogni destinazione interna — il router, Postgres, Redis, gli altri
    servizi dell'Umbrel — anche quando ci si arriva da un redirect esterno.


  Dalla 1.31.0 resta: il file dei segreti nasce già scritto con i campi da
  riempire, e un file che hai già non viene toccato. La copia leggera su
  Discord non c'è ancora.


  Il resto del sistema dei segreti è quello della 1.30. Token, chiavi e
  password vivono in `app-data/…/data/segreti/`, una cartella con i permessi
  stretti che gli aggiornamenti non toccano. Segreto di sessione, chiave di
  cifratura e password del database se li genera ANGEL al primo avvio;
  Postgres riceve la sua da un file (`POSTGRES_PASSWORD_FILE`) e monta quella
  cartella in sola lettura. Se manca qualcosa parte solo il pannello e il
  resto aspetta, ricontrollando ogni quindici secondi. Nei log compaiono i
  nomi, mai i valori.


  Aggiornando da una versione precedente: se avevi già un `segreti.env` in
  `data/storage` viene letto lo stesso, e nei log trovi il comando per
  spostarlo.

