# ─────────────────────────────────────────────────────────────
#  ANGEL — app per umbrelOS
#
#  ⚠️ QUI DENTRO NON C'È NESSUN VALORE SENSIBILE, E NON DEVE ENTRARCI.
#
#     umbrelOS riscrive questo file dal repository a ogni aggiornamento:
#     quello che ci si scriveva spariva, e andava rimesso ogni volta. E nel
#     frattempo token e chiavi stavano in chiaro in un file leggibile da
#     chiunque avesse accesso alla macchina.
#
#     Stanno invece in  ${APP_DATA_DIR}/data/segreti/, che gli aggiornamenti
#     non toccano. Quelli casuali ANGEL se li genera al primo avvio; gli
#     altri si scrivono una volta e restano. Finché mancano, parte solo il
#     pannello e il bot aspetta, ricontrollando ogni quindici secondi.
#
#  Differenze dal compose di ZimaOS, e non sono cosmetiche:
#
#  • C'è `app_proxy`. È il servizio con cui umbrelOS pubblica un'app: la
#    porta 780 la apre lui e la gira al container. Senza, l'app si
#    installa e non compare da nessuna parte.
#
#  • I percorsi passano da `${APP_DATA_DIR}`, che umbrelOS sostituisce con
#    la cartella dei dati dell'app. Scrivere percorsi assoluti come su
#    ZimaOS funzionerebbe finché qualcuno non sposta i dati.
#
#  • Redis è configurato come si deve. La VPS aveva `volatile-lru` e AOF
#    acceso: BullMQ protestava a ogni avvio — sfrattare una chiave di coda
#    significa perdere un lavoro in attesa senza che nessuno se ne accorga
#    — e l'AOF su disco lento produceva «fsync is taking too long» a
#    ripetizione. Qui è `noeviction` e AOF spento.
# ─────────────────────────────────────────────────────────────
version: "3.7"

services:
  # umbrelOS pubblica l'app attraverso questo. `APP_HOST` è il nome del
  # container come lo genera compose: <id-app>_<servizio>_1. Sbagliarlo
  # produce un'app che si installa, parte, e mostra una pagina bianca.
  app_proxy:
    environment:
      APP_HOST: g-d-app-store-gd-angel_angel_1
      APP_PORT: 8080

  # ─────────────────────────────────────────────────────────
  #  Un container che vive due secondi, e senza il quale non parte niente
  #
  #  Le cartelle di bind-mount le crea Docker, e le crea di `root`. ANGEL
  #  gira con `USER node` (uid 1000) e in una cartella di root non scrive:
  #  niente `postgres_password`, e Postgres esce a ripetizione con
  #
  #    /usr/local/bin/docker-entrypoint.sh: line 21:
  #    /segreti/postgres_password: No such file or directory
  #
  #  che assomiglia a un guasto del database e non lo è.
  #
  #  Questo container gira come root — è l'impostazione predefinita, non una
  #  concessione — sistema il proprietario, e finisce. Nessun `depends_on`
  #  con condizioni: sia ANGEL sia Postgres riprovano già per conto loro,
  #  quindi basta che il lavoro sia fatto entro qualche secondo.
  #
  #  Lo stesso vale per le copie e per gli allegati. Prima sistemava solo
  #  /segreti, e la cartella dei backup restava di root: ANGEL diceva
  #  «cartella di backup non disponibile (EACCES)» a ogni avvio, e i backup
  #  notturni su disco non venivano scritti. Qui si cambia solo quello che
  #  non è già di uid 1000: con migliaia di allegati, un `chown -R` a ogni
  #  avvio sarebbe lento per niente. Postgres e Redis hanno i loro utenti, e
  #  qui dentro non ci passano.
  # ─────────────────────────────────────────────────────────
  preparasegreti:
    image: alpine:3
    restart: "no"
    command:
      - sh
      - -c
      - "mkdir -p /segreti && chown -R 1000:1000 /segreti && chmod 700 /segreti && find /backup /storage ! -user 1000 -exec chown 1000:1000 {} +"
    volumes:
      - ${APP_DATA_DIR}/data/segreti:/segreti
      - ${APP_DATA_DIR}/data/backup:/backup
      - ${APP_DATA_DIR}/data/storage:/storage

  # ─────────────────────────────────────────────────────────
  #  ANGEL — un solo container per tutto
  #
  #  Dentro girano cinque cose: la migrazione del database, il bot
  #  Discord, il worker, il pannello e il bot Twitch. Un supervisore li
  #  tiene in vita e li riavvia se cadono, con attesa crescente fra un
  #  tentativo e l'altro.
  # ─────────────────────────────────────────────────────────
  angel:
    image: ghcr.io/gigiomiccio425/aegis-discord-bot:1.31.7
    restart: on-failure
    stop_grace_period: 1m

    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      TZ: Europe/Rome

      # ── Database e code ────────────────────────────────────
      # Il nome COMPLETO del container, mai quello corto del servizio.
      #
      # Su umbrelOS una rete dell'app non esiste: tutte le app stanno sulla
      # stessa rete, e ognuna ci registra i nomi dei propri servizi. Se
      # un'altra app ha un servizio chiamato `redis` — Immich, Nextcloud e
      # molte altre ce l'hanno — il nome `redis` risponde con due indirizzi,
      # e ogni connessione ne prende uno a caso.
      #
      # Con Redis è il guasto peggiore possibile, perché non dà errori: non
      # c'è password, quindi la connessione a quello sbagliato riesce. Il
      # pannello pubblica i comandi su un Redis, il bot li aspetta su un
      # altro, e tutti e due credono di funzionare. È così che «lockdown»
      # rispondeva «fatto» e non succedeva niente.
      #
      # È la stessa convenzione delle app ufficiali di umbrelOS
      # (`immich_redis_1`, `nextcloud_redis_1`), e il motivo è questo.
      # DATABASE_URL non c'è perché conterrebbe la password: la compone
      # ANGEL dal file che trova in /segreti, usando POSTGRES_HOST.
      REDIS_URL: redis://g-d-app-store-gd-angel_redis_1:6379
      POSTGRES_HOST: g-d-app-store-gd-angel_postgres_1

      # ── Dove stanno i valori ───────────────────────────────
      #
      # Qui dentro non ce n’è nessuno, ed è la differenza principale
      # rispetto a prima. umbrelOS riscrive questo file dal repository a
      # ogni aggiornamento: quello che ci si scriveva spariva, e nel
      # frattempo stava in chiaro in un file leggibile da chiunque avesse
      # accesso alla macchina.
      #
      # Adesso stanno in  ${APP_DATA_DIR}/data/segreti/segreti.env,
      # che gli aggiornamenti non toccano. ANGEL li legge all’avvio.
      #
      # Quelli casuali se li genera da solo al primo avvio — il segreto di
      # sessione, la chiave di cifratura, la password del database — e li
      # salva lì. Restano da dare solo quelli che nessuno può indovinare:
      #
      #   DISCORD_TOKEN=…
      #   DISCORD_CLIENT_ID=…
      #   DISCORD_CLIENT_SECRET=…
      #   PUBLIC_URL=http://il-tuo-umbrel:780
      #   OWNER_IDS=il-tuo-id-discord
      #
      # Finché mancano, parte **solo il pannello** e il bot aspetta:
      # ricontrolla ogni quindici secondi e parte da solo appena ci sono.
      # Nei log compaiono i nomi letti, mai i valori.
      SEGRETI_DIR: /segreti

      # Riserva il pannello agli ID in OWNER_IDS. Con 'false' entra
      # chiunque abbia «Gestisci server» dove il bot è presente.
      PANEL_OWNERS_ONLY: "true"
      API_PORT: "8080"

      # ── Scanner ────────────────────────────────────────────
      # Le chiavi facoltative (GOOGLE_SAFE_BROWSING_KEY, ABUSECH_AUTH_KEY)
      # vanno nel file dei segreti. Senza, restano le blocklist locali: già
      # centinaia di migliaia di domini, aggiornate ogni sei ore.
      THREAT_FEEDS_ENABLED: "true"
      THREAT_FEED_MAX: "150000"

      # ── Twitch ─────────────────────────────────────────────
      # Le credenziali stanno nel file dei segreti, come le altre. Senza,
      # il bot Twitch resta spento e non disturba nessuno.
      #
      #   TWITCH_CLIENT_ID=…
      #   TWITCH_CLIENT_SECRET=…
      #   TWITCH_BOT_USER_ID=…  TWITCH_BOT_LOGIN=…
      #   TWITCH_BOT_ACCESS_TOKEN=…  TWITCH_BOT_REFRESH_TOKEN=…
      #   TWITCH_PUBLIC_URL=http://il-tuo-umbrel:781
      TWITCH_PANEL_PORT: "781"

      # ── Percorsi e copie ───────────────────────────────────
      STORAGE_DIR: /data/storage
      BACKUP_DIR: /backup
      BACKUP_KEEP: "14"
      BACKUP_INCLUDE_STORAGE: "true"
      BACKUP_STORAGE_MAX_MB: "4096"

      # Per riportare qui i dati di un'altra installazione: copia la
      # cartella `trasloco-…` in app-data/g-d-app-store-gd-angel/data/backup,
      # togli il cancelletto, riavvia, poi rimettilo.
      # RESTORE_FROM: /backup/trasloco-2026-09-05T10-00-00
      # RESTORE_OVERWRITE: "1"

    volumes:
      # I segreti: cartella loro, separata dai dati, con i permessi stretti.
      - ${APP_DATA_DIR}/data/segreti:/segreti
      - ${APP_DATA_DIR}/data/storage:/data/storage
      # ⚠️ Su umbrelOS questa cartella vive dentro i dati dell'app, e
      #    disinstallando l'app sparisce insieme a tutto il resto. È il
      #    contrario di quello che serve a una copia di sicurezza: scarica
      #    il kit dal pannello ogni tanto e tienilo altrove.
      - ${APP_DATA_DIR}/data/backup:/backup

    ports:
      # Il pannello degli streamer Twitch, pubblicato direttamente e non
      # attraverso `app_proxy`. È voluto: `app_proxy` chiede l'accesso a
      # umbrelOS prima di far passare chiunque, e gli streamer un account
      # su questa macchina non ce l'hanno.
      - "781:781"

    depends_on:
      - postgres
      - redis

  postgres:
    # Debian e non Alpine: su alcune installazioni il bash dell'immagine
    # Alpine non risulta eseguibile e Postgres non parte, fallendo con
    # «env: can't execute bash: Permission denied» prima di scrivere una
    # riga di log.
    image: postgres:17
    restart: on-failure
    stop_grace_period: 1m

    environment:
      POSTGRES_USER: angel
      POSTGRES_DB: angel
      # La password la legge dal file che ANGEL genera al primo avvio: è
      # l'unico modo che ha questa immagine di riceverla senza che stia
      # scritta qui dentro. Se il file non c'è ancora, Postgres esce e
      # riprova finché non compare — qualche riga di log e poi parte.
      POSTGRES_PASSWORD_FILE: /segreti/postgres_password

    volumes:
      # In sola lettura: a Postgres serve leggere un file, non scriverci.
      - ${APP_DATA_DIR}/data/segreti:/segreti:ro
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: on-failure

    command:
      - redis-server
      # Istantanea ogni cinque minuti se sono cambiate almeno cento chiavi.
      - --save
      - "300 100"
      # AOF spento: qui dentro ci sono code e cache, non dati da custodire.
      # Acceso, su un disco lento produceva «fsync is taking too long» a
      # ripetizione — per riguadagnare, nel caso peggiore, qualche minuto
      # di coda che i lavori periodici ricreano da soli.
      - --appendonly
      - "no"
      # Un disco pieno non deve bloccare ogni scrittura: senza questo Redis
      # smette di servire e con lui si ferma tutto il bot.
      - --stop-writes-on-bgsave-error
      - "no"
      # noeviction e non volatile-lru: BullMQ lo pretende, e ha ragione —
      # sfrattare una chiave di coda significa perdere un lavoro in attesa
      # senza che nessuno se ne accorga. Redis qui occupa pochi megabyte,
      # il limite di memoria non serve.
      - --maxmemory-policy
      - noeviction

    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
