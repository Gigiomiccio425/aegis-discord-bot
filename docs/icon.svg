<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ANGEL">
  <title>ANGEL</title>

  <defs>
    <linearGradient id="scudo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dfae" />
      <stop offset="55%" stop-color="#d8b45f" />
      <stop offset="100%" stop-color="#a8823a" />
    </linearGradient>
    <linearGradient id="ala" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0dfae" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d8b45f" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0b0d13" />

  <!--
    Ali aperte dietro lo scudo. Sono due archi e non un disegno dettagliato:
    a 32 pixel — la dimensione a cui questa icona viene vista davvero, nella
    lista delle app — ogni piuma diventa una macchia, mentre una silhouette
    riconoscibile resta riconoscibile.
  -->
  <path d="M64 46 C46 34 30 34 18 44 c14 2 24 10 30 22 z" fill="url(#ala)" />
  <path d="M64 46 C82 34 98 34 110 44 c-14 2-24 10-30 22 z" fill="url(#ala)" />

  <!-- Scudo: la forma dice cosa fa il progetto senza bisogno di testo. -->
  <path
    d="M64 22 L98 34 V64 c0 22-14 35-34 43-20-8-34-21-34-43V34 Z"
    fill="url(#scudo)"
  />

  <!-- Aureola: appoggiata sopra, non addosso. -->
  <ellipse
    cx="64"
    cy="17"
    rx="17"
    ry="5.5"
    fill="none"
    stroke="#f0dfae"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Spunta interna: la difesa che ha funzionato. -->
  <path
    d="M50 65 l10 11 20-22"
    fill="none"
    stroke="#0b0d13"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
