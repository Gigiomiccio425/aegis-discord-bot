<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Aegis">
  <title>Aegis</title>

  <defs>
    <linearGradient id="scudo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5865f2" />
      <stop offset="100%" stop-color="#3b45c4" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#171a21" />

  <!-- Scudo: la forma dice cosa fa il progetto senza bisogno di testo. -->
  <path
    d="M64 20 L100 33 V64 c0 22-15 36-36 44-21-8-36-22-36-44V33 Z"
    fill="url(#scudo)"
  />

  <!-- Spunta interna: la difesa che ha funzionato. -->
